<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>Media Server Manager</title>
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: https://ssl.gstatic.com;
                 connect-src * http://* https://*;
                 img-src 'self' data: content: http://* https://*;
                 style-src 'self' 'unsafe-inline';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval';
                 frame-src http://* https://*;">
</head>
<body>
  <main class="app-shell">
    <section id="connect-screen" class="screen">
      <div class="logo">▰</div>
      <h1>Media Server Manager</h1>
      <p class="subtitle">Acceso privado a tu servidor multimedia.</p>

      <div class="status-card">
        <div class="status-row">
          <span id="status-dot" class="dot checking"></span>
          <div>
            <strong id="status-title">Buscando servidor…</strong>
            <small id="status-detail">Comprobando conexión con el manager</small>
          </div>
        </div>
      </div>

      <label for="server-url">Dirección del manager</label>
      <input id="server-url" type="url" inputmode="url"
             value="http://media-server-share.taild3fa5b.ts.net:8090"
             autocomplete="off" spellcheck="false">

      <div class="actions">
        <button id="connect-btn" class="primary">Conectar</button>
        <button id="retry-btn" class="secondary">Reintentar</button>
      </div>

      <div class="hints">
        <p>El móvil debe estar conectado a Tailscale.</p>
        <p>El servidor debe tener Media Server Manager activo.</p>
      </div>
    </section>
  </main>

  <script src="cordova.js"></script>
  <script src="app.js"></script>
</body>
</html>
